<!-- Download buttons shown under each page title:
     "This section (PDF)" uses the browser's Save as PDF, so it always works.
     "Full book (PDF)" appears once the book PDF has been built with `quarto render`. -->
<style>
  .sbae-downloads { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.6rem 0 1.4rem; }
  .sbae-downloads button, .sbae-downloads a {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-size: 0.88rem; font-weight: 600; padding: 0.35rem 0.85rem;
    border-radius: 999px; border: 1px solid var(--bs-primary, #116AAB);
    color: var(--bs-primary, #116AAB); background: transparent;
    text-decoration: none; cursor: pointer; transition: all 0.15s ease;
  }
  .sbae-downloads button:hover, .sbae-downloads a:hover {
    background: var(--bs-primary, #116AAB); color: #fff;
  }
  @page { size: A4; margin: 2cm; }
  @media print {
    #quarto-header, #quarto-sidebar, #quarto-margin-sidebar, .sidebar,
    nav.page-navigation, .nav-footer, footer, .sbae-downloads,
    .quarto-title-meta, #quarto-back-to-top, .anchorjs-link { display: none !important; }
    #quarto-content, main.content, .page-columns {
      display: block !important; margin: 0 !important; padding: 0 !important;
      max-width: 100% !important; width: 100% !important; grid-template-columns: 1fr !important;
    }
    body { font-size: 11pt; color: #000; background: #fff; }
    a { color: #000; text-decoration: none; }
    h1, h2, h3 { page-break-after: avoid; }
    img, table, figure, mjx-container { page-break-inside: avoid; }
  }
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var header = document.querySelector("#title-block-header") || document.querySelector("main h1");
  if (!header) return;

  var bar = document.createElement("div");
  bar.className = "sbae-downloads";

  var pageBtn = document.createElement("button");
  pageBtn.type = "button";
  pageBtn.innerHTML = '<i class="bi bi-file-earmark-pdf"></i> This section (PDF)';
  pageBtn.title = "Opens the print dialog; choose 'Save as PDF'";
  pageBtn.addEventListener("click", function () { window.print(); });
  bar.appendChild(pageBtn);

  // Reuse the link Quarto creates for the full-book PDF, if it exists
  var pdfLink = document.querySelector('a[href$=".pdf"]');
  if (pdfLink) {
    var bookBtn = document.createElement("a");
    bookBtn.href = pdfLink.getAttribute("href");
    bookBtn.setAttribute("download", "");
    bookBtn.innerHTML = '<i class="bi bi-book"></i> Full book (PDF)';
    bar.appendChild(bookBtn);
  }
  var docxLink = document.querySelector('a[href$=".docx"]');
  if (docxLink) {
    var wordBtn = document.createElement("a");
    wordBtn.href = docxLink.getAttribute("href");
    wordBtn.setAttribute("download", "");
    wordBtn.innerHTML = '<i class="bi bi-file-earmark-word"></i> Full book (Word)';
    bar.appendChild(wordBtn);
  }

  header.insertAdjacentElement("afterend", bar);

  // Hide full-book buttons if that file has not been built yet
  bar.querySelectorAll("a").forEach(function (a) {
    fetch(a.href, { method: "HEAD" }).then(function (r) {
      if (!r.ok) a.style.display = "none";
    }).catch(function () { a.style.display = "none"; });
  });
});
</script>
